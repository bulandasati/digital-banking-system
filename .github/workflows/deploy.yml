name: Build & Verify Digital Banking System CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Verify Microservices & Frontend Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build auth-service
        run: cd auth-service && mvn clean package -DskipTests

      - name: Build account-service
        run: cd account-service && mvn clean package -DskipTests

      - name: Build transaction-service
        run: cd transaction-service && mvn clean package -DskipTests

      - name: Build payment-service
        run: cd payment-service && mvn clean package -DskipTests

      - name: Build fraud-detection-service
        run: cd fraud-detection-service && mvn clean package -DskipTests

      - name: Build notification-service
        run: cd notification-service && mvn clean package -DskipTests

      - name: Build api-gateway
        run: cd api-gateway && mvn clean package -DskipTests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (Vite React)
        run: |
          cd frontend
          npm ci
          npm run build
